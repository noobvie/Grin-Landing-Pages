    <text x="96" y="378" font-size="35" fill="#E9EDE5">open in any browser.</text>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#98A69D">
    <text x="96" y="440">Official grin-wallet inside. No app, no store, no account.</text>
