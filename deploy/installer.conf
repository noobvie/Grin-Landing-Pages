# ─────────────────────────────────────────────────────────────────────────────
# installer.conf — config for site_manager.sh option G (deploy-installer)
#
# One URL, every platform:
#   curl -fsSL https://grinnode.org/install | sudo bash     → install.sh  (Linux: Grin Node Toolkit)
#   irm https://grinnode.org/install | iex                  → install.ps1 (Windows: Grin Money Desktop)
#   https://grinnode.org/install in a browser               → the site's install.html help page
# Fixed URLs as well: /install.sh, /install.ps1 and a .sha256 next to each.
# Option G publishes the scripts AND writes the nginx side (map, snippets, vhost
# include); re-run it after changing anything here.
# ─────────────────────────────────────────────────────────────────────────────

# Domain that serves the installers (its vhost must exist — option 1).
INSTALLER_SERVING_DOMAIN="grinnode.org"

# Domains whose /install, /install.sh, /install.ps1 answer 301 → the serving
# domain (space-separated; empty for none). grin.money keeps the older
# `irm https://grin.money/install | iex` working.
INSTALLER_REDIRECT_DOMAINS="grin.money"

# Where the published files live — OUTSIDE every web root, so a site deploy
# (rsync --delete into /var/www/<domain>/public) never removes them.
INSTALLER_TARGET_DIR="/var/www/grin-installers"

# Bare partial clones of the source repos (history + the installer file only).
INSTALLER_CACHE_ROOT="/opt/grin-installer-cache"

# Ownership + mode of the published files. root-owned and world-readable:
# nginx only needs to read them, and nothing running as the web server may
# ever rewrite a script that users pipe into a root shell.
INSTALLER_OWNER="root:root"
INSTALLER_PERMS="644"

# One row per published script:
#   published name | source repo (https) | branch | path in the repo | marker line
# The name must be install.sh (handed to curl/wget) or install.ps1 (handed to
# PowerShell). The marker must be one whole line within the file's first five
# lines, or option G refuses to publish it. Comment a row out to stop serving
# that script: option G deletes it and its URLs return 404.
INSTALLER_SCRIPTS=(
    "install.sh|https://github.com/noobvie/Grin-Node-Toolkit.git|main|install.sh|# grin-node-toolkit-installer"
    "install.ps1|https://github.com/noobvie/Grin-Money-Desktop.git|main|install.ps1|#Requires -Version 5.1"
)
