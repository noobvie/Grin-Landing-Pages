# ─────────────────────────────────────────────────────────────────────────────
# sites.conf — manifest of every site this server hosts (batch git deploy)
#
# Used by:  site_manager.sh  →  Deploy Site (3)  →  "ALL sites (batch git)"
#           and the unattended  --action deploy --all  cron form.
#
# One row per site. Whitespace-separated columns:
#
#     <site_key>            <domain>          [web_dir_override]
#
#   site_key          REQUIRED. Must match a subdirectory under web/ in the
#                     repo (the same key used in analytics.conf for GA4).
#   domain            REQUIRED. The web dir is derived as
#                       <nginx_root>/<domain>/public   (the house convention).
#   web_dir_override  OPTIONAL. Absolute path. Use only when a site lives
#                     somewhere other than <nginx_root>/<domain>/public.
#
# Lines starting with # and blank lines are ignored.
# The git repo + branch for the batch come from deploy/custom_repo.conf
# (GIT_REPO / GIT_BRANCH) or the --git-repo / --git-branch flags.
# GA4 IDs are joined on site_key from deploy/analytics.conf automatically.
# ─────────────────────────────────────────────────────────────────────────────

grin-money-2026     grin.money
grinnode-org-2026   grinnode.org
