# ─────────────────────────────────────────────────────────────────────────────
# sites.conf — manifest of every site this server hosts (batch git deploy)
#
# Used by:  site_manager.sh  →  Deploy Site (3)  →  "ALL sites (batch git)"
#           and the unattended  --action deploy --all  cron form.
#           Single-site deploys (git / local / rsync) read it too, to find the
#           archived editions of the site being deployed.
#
# One row per site. Whitespace-separated columns:
#
#     <site_key>            <domain>          [web_dir_override | archive]
#
#   site_key          REQUIRED. Must match a subdirectory under web/ in the
#                     repo (the same key used in analytics.conf for GA4).
#   domain            REQUIRED. The web dir is derived as
#                       <nginx_root>/<domain>/public   (the house convention).
#   web_dir_override  OPTIONAL. Absolute path (starts with "/"). Use only when a
#                     site lives somewhere other than <nginx_root>/<domain>/public.
#   archive           OPTIONAL. The literal word marks a PAST edition. It is not
#                     deployed on its own: it is published under /<year>/ of its
#                     domain's current site (year = the trailing -YYYY of its
#                     site_key), without its docs/, robots.txt and sitemap.xml,
#                     with every page marked noindex, its canonical pointed at
#                     https://<domain>/, relative links made absolute under
#                     /<year>/, docs/ links sent to the current /docs/, and a
#                     banner linking to the current site.
#
# Each domain has exactly ONE current (non-archive) row; an archive row needs
# that current row, and two archives of one domain cannot share a year. A
# manifest that breaks these rules stops every deploy that reads it.
#
# Lines starting with # and blank lines are ignored.
# The git repo + branch for the batch come from deploy/custom_repo.conf
# (GIT_REPO / GIT_BRANCH) or the --git-repo / --git-branch flags.
# GA4 IDs are joined on site_key from deploy/analytics.conf automatically; an
# archive is tagged with its current site's ID.
# ─────────────────────────────────────────────────────────────────────────────

grin-money-2026     grin.money
grinnode-org-2027   grinnode.org
grinnode-org-2026   grinnode.org        archive
fidelius-2026       fidelius.grin.money
