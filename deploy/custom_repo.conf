# ─────────────────────────────────────────────────────────────────────────────
# custom_repo.conf — Git deploy configuration for site_manager.sh
# ─────────────────────────────────────────────────────────────────────────────

# Site to deploy (must match a subdirectory under web/)
SITE_NAME="grin-money-2026"

# Git repository
GIT_REPO="https://github.com/noobvie/Grin-Landing-Pages.git"

# Branch to deploy
GIT_BRANCH="main"

# Remote web root on the server (empty = use nginx configured root)
DEPLOY_TARGET_DIR=""

# Sparse checkout — only fetch web/<SITE_NAME>/ (saves bandwidth)
SPARSE_CHECKOUT="yes"
