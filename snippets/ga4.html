<!--
  GA4 (Google Analytics 4) integration for landing pages
  ──────────────────────────────────────────────────────

  Configuration:
    1. Edit deploy/analytics.conf — add a line:  your-site-name="G-XXXXXXXXXX"
    2. Run:  ./site_manager.sh  →  option A (Analytics GA4)

  What the script does for each configured site:
    - Creates/updates  web/<site>/js/ga4.js   with the Measurement ID
    - Injects (or updates) these two tags before </head> in every .html:

        <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
        <script src="js/ga4.js"></script>

  To add GA4 manually (without the script):
    1. Copy js/ga4.js from an existing site, update the ID inside it
    2. Add the two script tags above inside <head> of every HTML file
-->
